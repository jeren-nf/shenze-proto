<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 跨境综合服务平台</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { margin:0; background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  .phone { width:390px; height:844px; border:10px solid #111; border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; }
  .screen { position:absolute; inset:0; background:url('img/login2_ref.png') center center / cover no-repeat; }
  /* 透明点击层 */
  .ovl { position:absolute; cursor:pointer; background:transparent; -webkit-tap-highlight-color:transparent; }
  .ovl:active { background:rgba(0,0,0,.06); }
  .tap-back { top:6px; left:6px; width:48px; height:48px; }
  .tap-buyer { left:10%; right:10%; top:54%; height:8%; border-radius:26px; }
  .tap-seller { left:10%; right:10%; top:67%; height:8%; border-radius:26px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen"></div>
    <div class="ovl tap-back" onclick="goBack()" aria-label="返回"></div>
    <div class="ovl tap-buyer" onclick="goLogin('buyer')" aria-label="买家登录"></div>
    <div class="ovl tap-seller" onclick="goLogin('seller')" aria-label="卖家登录"></div>
  </div>
  <script>
    var from = new URLSearchParams(location.search).get('from') || 's2_home.html';
    function goBack(){ if(history.length > 1){ history.back(); } else { location.href = from; } }
    function goLogin(role){
      // 进入微信授权页，并携带目标身份与回跳页
      location.href = 'wx_auth.html?from=' + encodeURIComponent(from) + '&role=' + encodeURIComponent(role);
    }
  </script>
<script src="i18n.js"></script>
</body>
</html>
