<style>
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:40px; box-shadow:0 12px 40px rgba(0,0,0,.12); overflow:hidden; position:relative; display:flex; flex-direction:column; margin:24px auto; }
  body { background:#E9EDF2; }

  /* 导航栏 */
  .navbar { flex:none; height:50px; background:#fff; display:flex; align-items:center; padding:0 8px; border-bottom:1px solid var(--border-weak); position:relative; }
  .nav-back { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; }
  .nav-back svg { width:24px; height:24px; stroke:var(--ink-primary); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .nav-title { position:absolute; left:0; right:0; text-align:center; font-size:17px; font-weight:600; color:var(--ink-primary); pointer-events:none; }

  /* 搜索 + 筛选栏 */
  .filterbar { flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--border-weak); }
  .search-input { flex:1; height:34px; background:var(--bg-page); border-radius:999px; display:flex; align-items:center; padding:0 12px; color:var(--ink-tertiary); font-size:13px; gap:6px; }
  .search-input svg { width:16px; height:16px; stroke:var(--ink-tertiary); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .search-input input { border:none; background:transparent; outline:none; flex:1; font-size:13px; color:var(--ink-primary); font-family:inherit; }
  .filter-entry { display:flex; align-items:center; gap:4px; flex:none; height:34px; padding:0 12px; border:1px solid #1677FF; color:#1677FF; background:#fff; border-radius:999px; font-size:13px; font-family:inherit; white-space:nowrap; cursor:pointer; }
  .filter-entry svg { width:15px; height:15px; stroke:#1677FF; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  /* 内联 Tab 切换 */
  .tabbar-inline { flex:none; display:flex; background:#fff; border-bottom:1px solid var(--border-weak); }
  .tab { flex:1; text-align:center; padding:12px 0; font-size:15px; color:var(--ink-tertiary); position:relative; cursor:pointer; }
  .tab.active { color:var(--color-primary); font-weight:600; }
  .tab.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:28px; height:3px; border-radius:2px; background:var(--color-primary); }

  /* 底部主导航 Tab（首页 / 商机 / 我的） */
  .botbar { height:56px; flex:none; background:#fff; border-top:1px solid var(--border-weak); display:flex; padding-bottom:6px; }
  .btab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-tertiary); font-size:10.5px; cursor:pointer; }
  .btab.active { color:var(--color-primary); }
  .btab .ic { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .btab.active .ic { stroke:var(--color-primary); background:var(--tab-active-bg); border-radius:50%; padding:3px; }

  /* 滚动区 */
  .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px; }
  .ptr { height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-tertiary); font-size:12px; transition:height .2s; }
  .list { display:block; }
  .loadmore { text-align:center; color:var(--ink-tertiary); font-size:12px; padding:14px 0; }

  /* 求购卡片（与首页一致） */
  .wf-card { display:flex; gap:10px; background:#fff; border:1px solid var(--border-weak); border-radius:var(--r-md); padding:10px; align-items:stretch; margin-bottom:10px; }
  .wf-card .thumb { width:88px; height:88px; border-radius:8px; overflow:hidden; flex:none; background:#E6F0FF; }
  .wf-card .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .wf-card .body { flex:1; display:flex; flex-direction:column; min-width:0; }
  .wf-card .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .wf-card h4 { font-size:14px; font-weight:600; margin:0; color:var(--ink-primary); }
  .wf-card .region { flex:none; display:flex; align-items:center; gap:3px; font-size:11px; color:var(--ink-secondary); }
  .wf-card .region .flag { font-size:14px; }
  .wf-card .cat { display:inline-block; font-size:11px; color:var(--color-primary); background:var(--color-primary-bg); border-radius:4px; padding:1px 6px; margin:5px 0; width:fit-content; }
  .wf-card .desc { font-size:12px; color:var(--ink-secondary); line-height:1.4; margin:0 0 5px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .wf-meta { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:auto; }
  .wf-card .qty { font-size:12px; color:var(--color-accent-active); font-weight:600; }
  .wf-card .wf-time { font-size:11px; color:var(--ink-tertiary); text-align:right; flex:none; white-space:nowrap; }

  /* 供应卡片 */
  .supply-card { background:#fff; border:1px solid var(--border-weak); border-radius:var(--r-md); padding:12px; margin-bottom:10px; }
  .supply-head { display:flex; align-items:center; gap:10px; }
  .avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; flex:none; }
  .supply-info { flex:1; display:flex; align-items:center; justify-content:space-between; min-width:0; gap:8px; }
  .supply-name { font-size:14px; font-weight:600; color:var(--ink-primary); }
  .supply-time { font-size:11px; color:var(--ink-tertiary); flex:none; white-space:nowrap; }
  .supply-content { font-size:13px; color:var(--ink-secondary); line-height:1.5; margin-top:8px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .supply-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .supply-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#f0f0f0; display:block; }

  /* 交易信息区（价格 + 起订量） */
  .supply-trade { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px 10px; background:#FAF9F6; border-radius:8px; }
  .supply-trade .trade-left { display:flex; align-items:baseline; gap:4px; min-width:0; }
  .supply-trade .trade-label { font-size:11px; color:var(--ink-tertiary); flex:none; }
  .supply-trade .trade-price { font-size:14px; font-weight:700; color:#F5222D; line-height:1; white-space:nowrap; }
  .supply-trade .trade-mianyi { font-size:14px; font-weight:600; color:var(--ink-secondary); }
  .supply-trade .trade-moq { flex:none; font-size:12px; font-weight:500; color:#1677FF; background:#E6F1FB; border-radius:999px; padding:4px 10px; white-space:nowrap; }

  /* 底部筛选面板 */


  /* Toast */
  .toast { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.78); color:#fff; font-size:13px; padding:10px 16px; border-radius:8px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
</style>

    priceHtml = '<span class="trade-price trade-mianyi">价格面议</span>';
  }
  const trade = '<div class="supply-trade"><div class="trade-left">'+priceHtml+'</div><span class="trade-moq">起订 '+d.moq+'</span></div>';
  let grid = '';
  if(d.imgs && d.imgs.length){
    grid = '<div class="supply-grid">'+ d.imgs.map(i=>'<img src="./img/index.html"+i+'.jpg" alt="">').join('') +'</div>';
  }
  el.innerHTML =
    '<div class="supply-head">'+
      '<div class="avatar" style="background:'+AV_COLORS[d.color%AV_COLORS.length]+'">'+d.initial+'</div>'+
      '<div class="supply-info"><div class="supply-name">'+d.name+'</div><div class="supply-time">'+d.time+'</div></div>'+
    '</div>'+
    '<div class="supply-content">'+d.content+'</div>'+
    trade +
    grid;
  return el;
}

/* 初始化列表 */
const listQ = document.getElementById('list-qiugou');
const listG = document.getElementById('list-gongying');
QIUGOU.forEach(d=> listQ.appendChild(qiugouCard(d)));
GONGYING.forEach(d=> listG.appendChild(supplyCard(d)));

/* Tab 切换（保持滚动位置） */
let currentTab = 'qiugou';
function switchTab(tab){
  if(tab===currentTab) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===tab));
  // 仅切换显示，不重置 scrollTop —— 滚动位置保持不变
  document.getElementById('list-qiugou').style.display = tab==='qiugou' ? '' : 'none';
  document.getElementById('list-gongying').style.display = tab==='gongying' ? '' : 'none';
  applyFilter();
}


/* 关键词搜索过滤 */
function applyFilter(){
  const q = document.getElementById('searchInput').value.trim();
  document.querySelectorAll('#list-qiugou .wf-card, #list-gongying .supply-card').forEach(card=>{
    const matchKw = !q || card.textContent.includes(q);
    card.style.display = matchKw ? '' : 'none';
  });
}

/* 下拉刷新 + 上拉加载 */
const scroll = document.getElementById('scroll');
const ptr = document.getElementById('ptr');
let refreshing = false, loading = false;
// 触摸下拉
let startY = 0, pulling = false;
scroll.addEventListener('touchstart', e=>{ if(scroll.scrollTop<=0){ startY = e.touches[0].clientY; pulling = true; } }, {passive:true});
scroll.addEventListener('touchmove', e=>{ if(pulling){ const dy = e.touches[0].clientY - startY; if(dy>0 && scroll.scrollTop<=0){ ptr.style.height = Math.min(dy*0.5,60)+'px'; ptr.textContent = dy*0.5>50 ? '释放刷新' : '下拉刷新'; } } }, {passive:true});
scroll.addEventListener('touchend', ()=>{ if(pulling){ if(parseInt(ptr.style.height)>50){ doRefresh(); } else { ptr.style.height='0'; } pulling=false; } });
// 桌面滚轮触发（便于预览）
let wheelAcc = 0;
scroll.addEventListener('wheel', e=>{ if(scroll.scrollTop<=0 && e.deltaY<0){ wheelAcc += -e.deltaY; if(wheelAcc>140 && !refreshing){ wheelAcc=0; doRefresh(); } } else { wheelAcc=0; } }, {passive:true});
function doRefresh(){
  refreshing = true; ptr.style.height='40px'; ptr.textContent='刷新中…';
  setTimeout(()=>{
    const fresh = Object.assign({}, QIUGOU[0]); fresh.time='刚刚'; fresh.title='（刷新）'+fresh.title;
    const c = qiugouCard(fresh); c.dataset.fresh='1';
    listQ.insertBefore(c, listQ.firstChild);
    applyFilter();
    ptr.textContent='刷新成功 ✓'; ptr.style.height='32px';
    setTimeout(()=>{ ptr.style.height='0'; refreshing=false; }, 500);
  }, 800);
}
// 上拉加载
scroll.addEventListener('scroll', ()=>{
  if(scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 50){
    if(!loading && !refreshing) doLoadMore();
  }
});
let loadCount = 0;
function doLoadMore(){
  loading = true;
  const lm = document.getElementById('loadmore'); lm.textContent='加载中…';
  setTimeout(()=>{
    const src = currentTab==='qiugou' ? QIUGOU : GONGYING;
    const target = currentTab==='qiugou' ? listQ : listG;
    for(let i=0;i<6;i++){
      const d = src[(loadCount*6+i) % src.length];
      const c = currentTab==='qiugou' ? qiugouCard(d) : supplyCard(d);
      target.appendChild(c);
    }
    loadCount++;
    lm.textContent='上拉加载更多';
    loading = false;
    applyFilter();
  }, 700);
}

/* 导航 / 搜索 / Toast */
function goHome(){ window.location.href="./s2_home.html"; }
function focusSearch(){ document.getElementById('searchInput').focus(); }
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 1600);
}

recomputeChecks();
</script>
