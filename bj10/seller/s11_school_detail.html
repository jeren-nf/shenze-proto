<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 小学堂详情</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .back { display:flex; align-items:center; }
  .icon-circle { width:34px; height:34px; border-radius:50%; background:var(--bg-page); display:flex; align-items:center; justify-content:center; position:relative; }
  .scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .btn-block { width:100%; }
  .cover { height:200px; background:linear-gradient(135deg,#1677FF,#4096FF); display:flex; align-items:center; justify-content:center; color:#fff; }
  .muted { color:var(--ink-tertiary); }
  .article { background:#fff; margin:12px 16px; border-radius:var(--r-md); padding:16px; border:1px solid var(--border-weak); }
  .article h2 { margin:0 0 10px; font-size:18px; }
  .article-meta { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-tertiary); margin-bottom:14px; }
  .article p { font-size:14px; line-height:1.8; color:var(--ink-secondary); margin:0 0 14px; }
  .img-block { height:160px; border-radius:var(--r-md); background:var(--color-primary-bg); display:flex; align-items:center; justify-content:center; color:var(--color-primary); margin:0 0 14px; }
  .fixed-bar { background:#fff; border-top:1px solid var(--border-weak); padding:10px 16px; display:flex; gap:12px; flex:none; }
  .fixed-bar .btn { flex:1; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div class="right"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="loc" style="font-size:16px">小学堂</div>
    <div class="icon-circle" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/></svg></div>
  </div>

  <div class="scroll">
    <div class="cover"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:40px;height:40px"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-9-4-9 4Z"/><path d="M3 7l9 4 9-4M9 12v5M15 12v5"/></svg></div>

    <div class="article">
      <h2>新手卖家如何快速完成企业认证</h2>
      <div class="article-meta"><span class="tag tag-blue">认证</span><span>申泽学堂</span><span>2026-07-30</span><span>1.2k 阅读</span></div>
      <p>企业认证是开启跨境供货的第一步。准备好营业执照、法人身份证与联系人信息，资料齐全后通常 1–2 个工作日即可完成审核。</p>
      <div class="img-block"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></div>
      <p>建议提前核对统一社会信用代码与营业执照名称是否完全一致，避免因信息不符被驳回。审核通过后即可发布供应、接收全球询盘。</p>
      <div class="img-block"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg></div>
      <p>若认证被驳回，系统会提示具体原因，按提示修改后重新提交即可，无需重复上传已通过项。</p>
    </div>
  </div>

  <div class="fixed-bar">
    <button class="btn btn-default" style="flex:1">
      <svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A4.5 4.5 0 0 0 12 5 4.5 4.5 0 0 0 2 8.5C2 10.7 3.5 12.5 5 14l7 7Z"/></svg>收藏
    </button>
    <button class="btn btn-primary" style="flex:1.6">分享给同事</button>
  </div>
</div>
</body>
</html>
