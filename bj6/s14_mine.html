<!DOCTYPE html>

<title>申泽跨境贸易 · 我的</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .icon-circle { width:34px; height:34px; border-radius:50%; background:var(--bg-page); display:flex; align-items:center; justify-content:center; position:relative; }
  .scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .uhead { margin:12px 16px; background:linear-gradient(135deg,#1677FF,#4096FF); border-radius:var(--r-lg); padding:20px; color:#fff; display:flex; align-items:center; gap:14px; }
  .uhead .avatar { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .menu { margin:12px 16px; background:#fff; border-radius:var(--r-md); border:1px solid var(--border-weak); overflow:hidden; }
  .menu-item { display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--border-weak); }
  .menu-item:last-child { border-bottom:none; }
  .menu-item .mi-ic { width:34px; height:34px; border-radius:9px; background:var(--color-primary-bg); display:flex; align-items:center; justify-content:center; position:relative; }
  .menu-item .mi-ic .ic { stroke:var(--color-primary); }
  .menu-item .arrow { margin-left:auto; }
  .badge-dot { position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 4px; background:var(--color-error); color:#fff; border-radius:999px; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
  .btn-danger-text { background:transparent; color:var(--color-error); height:auto; padding:0; font-weight:400; }
  .tabbar { height:56px; flex:none; background:#fff; border-top:1px solid var(--border-weak); display:flex; padding-bottom:6px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-tertiary); font-size:10.5px; }
  .tab.active { color:var(--color-primary); }
  .tab .ic { width:22px; height:22px; }
  .tab.active .ic { stroke:var(--color-primary); }
  .tab .badge-dot { top:2px; right:50%; transform:translateX(14px); }
</style>
</head>
