<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 管理后台 / 内容编辑</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ===== 后台布局骨架（复用 a1_dashboard.html） ===== */
  .admin { display: flex; min-height: 100vh; }
  .sidebar { width: 224px; flex: none; background: #fff; border-right: 1px solid var(--border-weak); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-5) var(--sp-4); border-bottom: 1px solid var(--border-weak); }
  .brand-mark { width: 36px; height: 36px; border-radius: var(--r-md); flex: none; background: linear-gradient(135deg, #F5A623, #FFB340); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; font-family: var(--font-cn); box-shadow: var(--shadow-hover); }
  .brand-name { font-size: 15px; font-weight: 700; color: var(--ink-primary); line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--ink-tertiary); }
  .nav { padding: var(--sp-3) var(--sp-2); overflow-y: auto; flex: 1; }
  .nav-group-title { font-size: 11px; color: var(--ink-tertiary); padding: var(--sp-3) var(--sp-3) var(--sp-1); font-weight: 600; letter-spacing: .04em; }
  .nav-item { display: flex; align-items: center; gap: var(--sp-3); height: 40px; padding: 0 var(--sp-3); border-radius: var(--r-md); color: var(--ink-secondary); font-size: 14px; position: relative; margin-bottom: 2px; transition: background .15s ease, color .15s ease; }
  .nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
  .nav-item.active { background: var(--color-primary-bg); color: var(--color-primary-active); font-weight: 600; }
  .nav-item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--color-primary); }
  .nav-item .ic { width: 18px; height: 18px; }
  .nav-item.active .ic { stroke: var(--color-primary-active); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 60px; flex: none; background: #fff; border-bottom: 1px solid var(--border-weak); display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-5); position: sticky; top: 0; z-index: 10; }
  .search { flex: 1; max-width: 420px; height: 38px; display: flex; align-items: center; gap: var(--sp-2); background: var(--bg-page); border: 1px solid transparent; border-radius: var(--r-md); padding: 0 var(--sp-3); color: var(--ink-tertiary); font-size: 13px; transition: all .15s ease; }
  .search:focus-within { background: #fff; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-bg); }
  .search input { border: none; background: transparent; outline: none; flex: 1; font-family: inherit; font-size: 13px; color: var(--ink-primary); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--sp-5); }
  .icon-btn { position: relative; width: 38px; height: 38px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .icon-btn:hover { background: var(--bg-hover); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; cursor: pointer; }
  .avatar-verified { position: relative; }
  .avatar-verified::after { content: "✓"; position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; background: var(--color-primary); color: #fff; border: 2px solid #fff; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; }
  .content { padding: var(--sp-5); }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: var(--sp-5); }
  .page-title { font-size: var(--fs-h1); font-weight: 700; }
  .crumb { font-size: 12px; color: var(--ink-tertiary); margin-bottom: 4px; }
  .crumb b { color: var(--ink-secondary); font-weight: 600; }

  /* ===== 本页扩展（富文本编辑器） ===== */
  .panel { padding: var(--sp-5); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--sp-4); }
  .field > label { font-size: 13px; color: var(--ink-secondary); }
  .field .req { color: var(--color-error); }
  .inp { height: 38px; border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 0 var(--sp-3); font-size: 13px; font-family: inherit; color: var(--ink-primary); background: #fff; outline: none; }
  .inp:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-bg); }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--sp-4); }
  .cover-drop { height: 120px; border: 1px dashed var(--color-primary-border); border-radius: var(--r-md); background: var(--color-primary-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--color-primary-active); cursor: pointer; font-size: 13px; }
  .cover-drop:hover { background: #d6ebff; }
  .editor { border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: var(--bg-page); border-bottom: 1px solid var(--border-weak); flex-wrap: wrap; }
  .toolbar .tb { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--ink-secondary); cursor: pointer; }
  .toolbar .tb:hover { background: var(--bg-hover); color: var(--color-primary); }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border-weak); margin: 0 4px; }
  .editor-body { min-height: 280px; padding: var(--sp-4); font-size: 14px; line-height: 1.8; color: var(--ink-primary); outline: none; }
  .editor-body:empty::before { content: "在此输入正文内容，支持图文混排…"; color: var(--ink-tertiary); }
  .meta-side { display: flex; flex-direction: column; gap: var(--sp-2); }
  .actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-5); justify-content: flex-end; }
</style>
</head>
<body>
<div class="admin">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">申</div>
      <div>
        <div class="brand-name">申泽跨境贸易</div>
        <div class="brand-sub">Shenze Trade Platform</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group-title">概览</div>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>工作台</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>用户管理</a>
      <div class="nav-group-title">交易管理</div>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h18l-1.5 11.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5L3 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>询盘管理</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>供应管理</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>品类管理</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><rect x="1" y="6" width="15" height="12" rx="2"/><path d="M16 9h4l3 3v6h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>物流订单</a>
      <div class="nav-group-title">审核与风控</div>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4Z"/></svg>企业认证审核<span class="badge-dot" style="position:static;margin-left:auto;border:none;">5</span></a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>敏感词管理</a>
      <div class="nav-group-title">内容与权限</div>
      <a class="nav-item active"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2-1.5Z"/><path d="M18 4v16"/></svg>小学堂管理</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11a3 3 0 1 0 0-6"/><path d="M21 20a5 5 0 0 0-5-5"/></svg>权限矩阵</a>
      <a class="nav-item"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1A2 2 0 1 1 7.3 4.1l.1.1A1.7 1.7 0 0 0 10 3.4V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1A2 2 0 1 1 19.9 7l-.1.1A1.7 1.7 0 0 0 21 9.9V10a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.4 1Z"/></svg>系统设置</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="搜索供应商、询盘、订单号…" />
      </div>
      <div class="topbar-right">
        <div class="icon-btn"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge-dot">3</span></div>
        <div class="icon-btn"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="avatar avatar-verified" title="管理员">管</div>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div>
          <div class="crumb">内容与权限 / 小学堂管理 / <b>编辑</b></div>
          <div class="page-title">内容编辑</div>
        </div>
        <a class="btn btn-default" href="a6_content.html">返回列表</a>
      </div>

      <div class="row2">
        <!-- 左：编辑器 -->
        <section class="card panel">
          <div class="field">
            <label>标题 <span class="req">*</span></label>
            <input class="inp" value="2026 跨境电商通关实务详解" />
          </div>
          <div class="field">
            <label>正文 <span class="req">*</span></label>
            <div class="editor">
              <div class="toolbar">
                <span class="tb" title="加粗"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg></span>
                <span class="tb" title="斜体"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></span>
                <span class="tb" title="下划线"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg></span>
                <span class="sep"></span>
                <span class="tb" title="标题"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 4v16M18 4v16M6 12h12"/></svg></span>
                <span class="tb" title="列表"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></span>
                <span class="tb" title="引用"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M3 21c3-6 6-9 6-12V5H3z"/><path d="M15 21c3-6 6-9 6-12V5h-6z"/></svg></span>
                <span class="sep"></span>
                <span class="tb" title="插入图片"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 16 5-4 4 3 3-2 4 3"/></svg></span>
                <span class="tb" title="插入链接"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></span>
                <span class="tb" title="视频"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><polygon points="6 4 20 12 6 20 6 4" fill="none"/></svg></span>
                <span class="sep"></span>
                <span class="tb" title="撤销"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></span>
                <span class="tb" title="重做"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg></span>
              </div>
              <div class="editor-body" contenteditable="true">跨境电商通关涉及报关、查验、缴税等多个环节。本文梳理 2026 年最新实务要点，帮助商家降低合规风险……</div>
            </div>
          </div>
        </section>

        <!-- 右：元信息 -->
        <aside class="meta-side">
          <section class="card panel">
            <div class="panel-title" style="font-size:var(--fs-h2);font-weight:600;margin-bottom:var(--sp-4);">发布设置</div>
            <div class="field">
              <label>分类 <span class="req">*</span></label>
              <select class="inp"><option>通关实务</option><option>选品指南</option><option>物流知识</option><option>政策解读</option></select>
            </div>
            <div class="field">
              <label>类型</label>
              <select class="inp"><option>图文</option><option>视频</option></select>
            </div>
            <div class="field">
              <label>封面图 <span class="req">*</span></label>
              <div class="cover-drop">
                <svg class="ic" viewBox="0 0 24 24" style="stroke:var(--color-primary-active);width:24px;height:24px"><path d="M12 5v14M5 12h14"/></svg>
                点击上传封面（建议 16:9）
              </div>
            </div>
            <div class="field">
              <label>状态</label>
              <select class="inp"><option>立即发布</option><option>存为草稿</option></select>
            </div>
          </section>
        </aside>
      </div>

      <div class="actions">
        <button class="btn btn-default">预览</button>
        <button class="btn btn-default">存草稿</button>
        <button class="btn btn-primary" onclick="alert('内容已保存并发布。')">保存并发布</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
