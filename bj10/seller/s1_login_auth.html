<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 登录与商家认证</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .topbar .search-mini { flex:1; height:34px; background:var(--bg-page); border-radius:var(--r-pill); display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--ink-tertiary); font-size:12px; }
  .icon-circle { width:34px; height:34px; border-radius:50%; background:var(--bg-page); display:flex; align-items:center; justify-content:center; position:relative; }
  .scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .btn-block { width:100%; }
  .back { display:flex; align-items:center; }
  .brand { text-align:center; padding:26px 16px 6px; }
  .logo { width:64px; height:64px; border-radius:16px; background:linear-gradient(135deg,#1677FF,#4096FF); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:#fff; font-size:26px; font-weight:800; box-shadow:0 6px 16px rgba(22,119,255,.3); }
  .brand h1 { margin:0; font-size:18px; }
  .brand p { margin:4px 0 0; color:var(--ink-tertiary); font-size:12px; }
  .form-card { margin:14px 16px; background:#fff; border-radius:var(--r-md); padding:14px; border:1px solid var(--border-weak); }
  .field { margin:0 0 14px; }
  .field:last-child { margin-bottom:0; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .req { color:var(--color-error); margin-left:2px; }
  .input, .select, .textarea { width:100%; border:1px solid var(--border-strong); border-radius:var(--r-md); padding:10px 12px; font-size:14px; color:var(--ink-primary); background:#fff; }
  .hint { color:var(--color-error); font-size:12px; margin:6px 16px 0; }
  .auth-status { margin:16px; background:#fff; border-radius:var(--r-md); padding:14px; border:1px solid var(--border-weak); }
  .auth-status .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .status-line { display:flex; align-items:center; gap:8px; }
  .dot-s { width:10px; height:10px; border-radius:50%; background:var(--color-accent); }
  .dot-g { width:10px; height:10px; border-radius:50%; background:var(--color-success); }
  .legal { text-align:center; color:var(--ink-tertiary); font-size:11px; margin:16px; line-height:1.7; }
  .legal a { color:var(--color-primary); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div class="right"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="loc" style="font-size:16px">商家认证</div>
  </div>

  <div class="scroll">
    <div class="brand">
      <div class="logo">申</div>
      <h1>申泽跨境贸易服务平台</h1>
      <p>卖家端 · 让中国制造卖向全球</p>
    </div>

    <button class="btn btn-primary btn-block" style="margin:10px 16px 0">
      <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff"><path d="M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z"/><path d="M3 11c0-1 .8-1.8 1.8-1.7C5.4 7 7 5.5 9 6c.4-1.7 2-3 3.7-2.7C14.5 2.5 16.5 4 16.4 6c2 .4 3.2 2.4 2.6 4.3C21 11 21 13 19.5 13.6 18 16 14.5 16 12 14.8 9.5 16 6 16 4.5 13.6 3 13 3 12 3 11Z"/></svg>
      微信一键登录
    </button>

    <div style="display:flex;align-items:center;gap:8px;color:var(--ink-tertiary);font-size:12px;margin:18px 16px 0">
      <span style="flex:1;height:1px;background:var(--border-weak)"></span>或 提交认证资料<span style="flex:1;height:1px;background:var(--border-weak)"></span>
    </div>

    <div class="form-card">
      <div class="field"><label>企业名称<span class="req">*</span></label><input class="input" placeholder="请输入营业执照上的企业全称"/></div>
      <div class="field"><label>营业执照号<span class="req">*</span></label><input class="input" placeholder="统一社会信用代码（18 位）"/></div>
      <div class="field"><label>联系人<span class="req">*</span></label><input class="input" placeholder="请输入业务联系人姓名"/></div>
      <div class="field"><label>手机号<span class="req">*</span></label><input class="input" placeholder="请输入手机号" value="138****8000"/></div>
      <div class="hint">带 * 为必填项，请填写与营业执照一致的信息</div>
    </div>

    <div class="auth-status">
      <div class="head"><span style="font-weight:700;font-size:14px">当前认证状态</span><span class="tag tag-orange">待审核</span></div>
      <p style="color:var(--ink-tertiary);font-size:12px;margin:0 0 12px">资料已提交，预计 1–2 个工作日完成审核，请耐心等待。</p>
      <div class="status-line"><span class="dot-s"></span><span style="font-size:13px">待审核（资料已提交）</span></div>
      <div class="status-line" style="margin-top:8px;color:var(--ink-tertiary)"><span class="dot-g" style="background:var(--border-strong)"></span><span style="font-size:13px">已认证（审核通过）</span></div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:8px"><span class="tag tag-green">已认证</span><span style="font-size:12px;color:var(--ink-tertiary)">示例：审核通过后展示此状态</span></div>
    </div>

    <div class="legal">登录即代表同意 <a href="#">《用户协议》</a> 与 <a href="#">《隐私政策》</a></div>
  </div>
</div>
</body>
</html>
