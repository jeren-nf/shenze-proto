<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 我的供应</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .topbar .search-mini { flex:1; height:34px; background:var(--bg-page); border-radius:var(--r-pill); display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--ink-tertiary); font-size:12px; }
  .icon-circle { width:34px; height:34px; border-radius:50%; background:var(--bg-page); display:flex; align-items:center; justify-content:center; position:relative; }
  .scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .chips { display:flex; gap:8px; padding:10px 16px; background:#fff; }
  .chip { flex:none; padding:6px 14px; border-radius:var(--r-pill); background:var(--bg-page); font-size:13px; color:var(--ink-secondary); }
  .chip.on { background:var(--color-primary-bg); color:var(--color-primary); font-weight:600; }
  .row-card { background:#fff; border-radius:var(--r-md); padding:14px; margin:0 16px 12px; border:1px solid var(--border-weak); }
  .feed-price { color:var(--color-accent-active); font-weight:700; font-size:15px; }
  .btn-text { background:transparent; color:var(--color-primary); height:auto; padding:0; font-weight:400; }
  .btn-danger-text { background:transparent; color:var(--color-error); height:auto; padding:0; font-weight:400; }
  .tabbar { height:56px; flex:none; background:#fff; border-top:1px solid var(--border-weak); display:flex; padding-bottom:6px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-tertiary); font-size:10.5px; }
  .tab.active { color:var(--color-primary); }
  .tab .ic { width:22px; height:22px; }
  .tab.active .ic { stroke:var(--color-primary); }
  .tab .badge-dot { top:2px; right:50%; transform:translateX(14px); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div class="right"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="loc" style="font-size:16px">我的供应</div>
    <div class="search-mini" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>搜索我的供应</div>
    <div class="icon-circle"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>

  <div class="scroll">
    <div class="chips">
      <span class="chip on">全部</span>
      <span class="chip">已发布</span>
      <span class="chip">待审核</span>
      <span class="chip">已下架</span>
    </div>

    <div class="row-card">
      <div style="display:flex;gap:12px">
        <div style="width:72px;height:72px;border-radius:8px;background:var(--color-primary-bg);display:flex;align-items:center;justify-content:center;color:var(--color-primary);font-size:12px;font-weight:600;flex:none">轴承</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">ISO 9001 工业轴承 批量供应</div>
          <div class="muted" style="font-size:12px;margin-top:4px">发布于 2026-07-20</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="feed-price">¥8.50/套</span><span class="tag tag-blue" style="margin-left:auto">已发布</span></div>
        </div>
      </div>
      <div style="display:flex;gap:18px;border-top:1px solid var(--border-weak);padding-top:10px;margin-top:10px;justify-content:flex-end">
        <span class="btn-text">编辑</span><span class="btn-text">下架</span><span class="btn-danger-text">删除</span>
      </div>
    </div>

    <div class="row-card">
      <div style="display:flex;gap:12px">
        <div style="width:72px;height:72px;border-radius:8px;background:var(--color-accent-bg);display:flex;align-items:center;justify-content:center;color:var(--color-accent-active);font-size:12px;font-weight:600;flex:none">连接件</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">新能源汽车 OEM 连接件</div>
          <div class="muted" style="font-size:12px;margin-top:4px">发布于 2026-08-01</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="feed-price">¥23.00/套</span><span class="tag tag-orange" style="margin-left:auto">待审核</span></div>
        </div>
      </div>
      <div style="display:flex;gap:18px;border-top:1px solid var(--border-weak);padding-top:10px;margin-top:10px;justify-content:flex-end">
        <span class="btn-text">编辑</span><span class="btn-text">下架</span><span class="btn-danger-text">删除</span>
      </div>
    </div>

    <div class="row-card">
      <div style="display:flex;gap:12px">
        <div style="width:72px;height:72px;border-radius:8px;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;color:var(--ink-tertiary);font-size:12px;font-weight:600;flex:none">面料</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">防水透气功能性面料</div>
          <div class="muted" style="font-size:12px;margin-top:4px">下架于 2026-06-12</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="feed-price">¥15.00/米</span><span class="tag tag-gray" style="margin-left:auto">已下架</span></div>
        </div>
      </div>
      <div style="display:flex;gap:18px;border-top:1px solid var(--border-weak);padding-top:10px;margin-top:10px;justify-content:flex-end">
        <span class="btn-text">编辑</span><span class="btn-text">上架</span><span class="btn-danger-text">删除</span>
      </div>
    </div>
    <p class="muted" style="font-size:12px;text-align:center;margin:4px 0 8px">删除操作将二次确认，且不可恢复</p>
  </div>

  <div class="tabbar">
    <div class="tab"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>首页</div>
    <div class="tab active"><svg class="ic" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>供应</div>
    <div class="tab"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>询盘</div>
    <div class="tab"><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>消息</div>
    <div class="tab"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</div>
  </div>
</div>
</body>
</html>
