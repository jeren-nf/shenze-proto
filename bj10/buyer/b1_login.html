<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 买家登录（EN）</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background: #E9EDF2; display: flex; justify-content: center; padding: 32px 0; }
  .phone { width: 390px; height: 844px; background: var(--bg-page); border-radius: 44px; box-shadow: 0 24px 60px rgba(0,0,0,0.18); overflow: hidden; position: relative; border: 10px solid #111; display: flex; flex-direction: column; }
  .statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; font-weight: 600; }
  .topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; }
  .topbar .brand { font-size: 15px; font-weight: 700; font-family: var(--font-en); }
  .lang-toggle { margin-left: auto; display: inline-flex; background: var(--bg-page); border-radius: var(--r-pill); padding: 2px; font-size: 11px; font-weight: 600; }
  .lang-toggle span { padding: 4px 8px; border-radius: var(--r-pill); cursor: pointer; color: var(--ink-tertiary); }
  .lang-toggle span.on { background: #fff; color: var(--color-primary); box-shadow: var(--shadow-hover); }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover)); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(22,119,255,.28); }
  .logo svg { width: 38px; height: 38px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .hero h1 { margin: 0; font-size: 22px; font-weight: 800; font-family: var(--font-en); }
  .hero p { margin: 10px 0 0; font-size: 13px; color: var(--ink-secondary); line-height: 1.6; font-family: var(--font-en); }

  .actions { padding: 0 24px 40px; }
  .btn-wechat { width: 100%; height: 48px; border-radius: var(--r-md); background: #07C160; color: #fff; border: none; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-en); }
  .btn-wechat svg { width: 22px; height: 22px; fill: #fff; }
  .note { margin: 16px 0 0; font-size: 11.5px; color: var(--ink-tertiary); text-align: center; line-height: 1.6; font-family: var(--font-en); }
  .note b { color: var(--color-accent-active); font-weight: 600; }
  .terms { margin-top: 12px; text-align: center; font-size: 11px; color: var(--ink-tertiary); font-family: var(--font-en); }
  .terms a { color: var(--color-primary); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div style="display:flex;gap:6px;align-items:center;"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="brand" data-en="ShenZe Trade" data-zh="申泽贸易">ShenZe Trade</div>
    <div class="lang-toggle" id="langToggle">
      <span class="on" data-lang="en">EN</span><span data-lang="zh">中</span>
    </div>
  </div>

  <div class="hero">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 11a8 8 0 0 1 8-8 8 8 0 0 1 7.7 5.8A6.5 6.5 0 0 1 16 19H11l-5 3 1-3.5A8 8 0 0 1 3 11Z"/></svg></div>
    <h1 data-en="Buyer Platform" data-zh="买家平台">Buyer Platform</h1>
    <p data-en="Source from verified global suppliers. Post RFQs and get matched instantly." data-zh="对接全球认证供应商，发布询盘即刻智能匹配。">Source from verified global suppliers. Post RFQs and get matched instantly.</p>
  </div>

  <div class="actions">
    <button class="btn-wechat">
      <svg viewBox="0 0 24 24"><path d="M8.7 3C4.9 3 1.8 5.8 1.8 9.2c0 1.9 1 3.6 2.7 4.8L3.6 16l2.3-1.2c.9.3 1.8.4 2.8.4h.6a5.4 5.4 0 0 1-.2-1.4c0-3.2 3.1-5.6 6.8-5.6h.6C15.6 5.4 12.5 3 8.7 3Zm-2.4 3.4a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Zm4.8 0a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/><path d="M22.2 14.6c0-2.9-2.8-5.2-6.2-5.2s-6.2 2.3-6.2 5.2 2.8 5.2 6.2 5.2c.7 0 1.4-.1 2-.3l2 1-.5-1.7c1.6-1 2.7-2.4 2.7-4.2Zm-8.2-1.1a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Zm4 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/></svg>
      <span data-en="Sign in with WeChat" data-zh="微信登录">Sign in with WeChat</span>
    </button>
    <p class="note" data-en="No verification required to browse or post RFQs. Verification unlocks order &amp; payment features." data-zh="无需认证即可浏览或发布询盘；认证后解锁下单与支付功能。">No verification required to browse or post RFQs. Verification unlocks order &amp; payment features.</p>
    <div class="terms" data-en="By continuing you agree to our <a href='#'>Terms</a> &amp; <a href='#'>Privacy</a>." data-zh="继续即代表同意<a href='#'>服务条款</a>与<a href='#'>隐私政策</a>。">By continuing you agree to our <a href='#'>Terms</a> &amp; <a href='#'>Privacy</a>.</div>
  </div>
</div>

<script>
  var toggle = document.getElementById('langToggle');
  toggle.addEventListener('click', function (e) {
    var t = e.target.closest('span'); if (!t) return;
    var lang = t.getAttribute('data-lang');
    toggle.querySelectorAll('span').forEach(function(s){ s.classList.toggle('on', s === t); });
    document.querySelectorAll('[data-en]').forEach(function (el) {
      el.innerHTML = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
    });
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    try { localStorage.setItem('shenze_lang', lang); } catch (_) {}
  });
  try {
    var saved = localStorage.getItem('shenze_lang');
    if (saved === 'zh') toggle.querySelector('[data-lang="zh"]').click();
  } catch (_) {}
</script>
</body>
</html>
