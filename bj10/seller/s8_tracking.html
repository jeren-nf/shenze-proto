<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 物流跟踪</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .back { display:flex; align-items:center; }
  .scroll { flex:1; overflow-y:auto; padding:14px 16px 8px; }
  .wb-head { background:#fff; border-radius:var(--r-md); padding:14px; border:1px solid var(--border-weak); margin-bottom:14px; }
  .wb-no { font-size:14px; font-weight:700; }
  .muted { color:var(--ink-tertiary); }
  .timeline { position:relative; padding-left:26px; }
  .tl-node { position:relative; padding-bottom:22px; }
  .tl-node:last-child { padding-bottom:0; }
  .tl-node::before { content:""; position:absolute; left:-19px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--color-success); border:2px solid #fff; box-shadow:0 0 0 2px var(--color-success); }
  .tl-node::after { content:""; position:absolute; left:-14px; top:14px; bottom:0; width:2px; background:var(--border-strong); }
  .tl-node:last-child::after { display:none; }
  .tl-node.active::before { background:var(--color-accent); box-shadow:0 0 0 2px var(--color-accent); }
  .tl-node.active::after { background:var(--color-accent-border); }
  .tl-node.error::before { background:var(--color-error); box-shadow:0 0 0 2px var(--color-error); }
  .tl-node.pending::before { background:var(--border-strong); box-shadow:0 0 0 2px var(--border-strong); }
  .tl-node.pending::after { background:var(--border-weak); }
  .tl-title { font-size:14px; font-weight:600; }
  .tl-time { font-size:12px; color:var(--ink-tertiary); margin-top:2px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div class="right"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="loc" style="font-size:16px">物流跟踪</div>
  </div>

  <div class="scroll">
    <div class="wb-head">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="wb-no">SF7392846510</span>
        <span class="tag tag-orange">运输中</span>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px">工业轴承 1000 套 · 空运 · 上海 → 汉堡</div>
    </div>

    <div class="timeline">
      <div class="tl-node">
        <div class="tl-title">已揽收</div>
        <div class="tl-time">2026-08-02 10:12 · 上海浦东转运中心</div>
      </div>
      <div class="tl-node active">
        <div class="tl-title">运输中</div>
        <div class="tl-time">2026-08-03 22:40 · 航班 CA931 已起飞</div>
      </div>
      <div class="tl-node error">
        <div class="tl-title" style="color:var(--color-error-text)">清关中 · 异常</div>
        <div class="tl-time" style="color:var(--color-error-text)">2026-08-04 14:20 · 单证缺失，待补充 HS 编码</div>
      </div>
      <div class="tl-node pending">
        <div class="tl-title">派送中</div>
        <div class="tl-time">待更新</div>
      </div>
      <div class="tl-node pending">
        <div class="tl-title">已签收</div>
        <div class="tl-time">待更新</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
