<title>北明数贸 · 卖家端首页（任务二规范 · 华商GO 视觉）</title>
<style>
:root{
  /* 任务二：灰底 + 蓝点缀（华商GO 实测） */
  --bg-page:#F3F3F3; --card:#FFFFFF; --subtle:#F7F7F7;
  --primary:#146FEF; --primary-ink:#1369E2; --primary-bg:#E6F4FF;
  --accent:#F5A623; --accent-ink:#1A1A1A;
  --price:#C93C3E;
  --brand-deep:#2D56A5;
  --ink-1:#1A1A1A; --ink-2:#595959; --ink-3:#6F6F6F;
  --line:#EFEFEF; --line-2:#DCDCDC;
  --g-banner-1:#17DAAE; --g-banner-2:#146FEF;
  --r-lg:16px; --r-md:8px;
  --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9EDF2;display:flex;justify-content:center;padding:28px 0;
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",-apple-system,sans-serif;
  color:var(--ink-1);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.phone{width:390px;height:844px;background:var(--bg-page);border-radius:44px;
  box-shadow:0 24px 60px rgba(0,0,0,.18);overflow:hidden;position:relative;
  border:10px solid #111;display:flex;flex-direction:column}

.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:13px;font-weight:600}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-sig{display:flex;gap:1.5px;align-items:flex-end}
.sb-sig i{width:3px;background:#111;display:block;border-radius:1px}
.sb-bat{width:22px;height:11px;border:1px solid #111;border-radius:2px;position:relative}
.sb-bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;
  background:#111;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:14px;background:#111;border-radius:1px}

.topbar{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff}
.brand{display:flex;align-items:center;gap:7px;flex:none}
.brand img{width:30px;height:30px;object-fit:contain}
.brand span{font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.search{flex:1;height:44px;min-height:44px;background:var(--subtle);border-radius:999px;
  display:flex;align-items:center;gap:6px;padding:0 14px;color:var(--ink-3);font-size:13px;
  transition:flex .2s ease}
.search svg{width:17px;height:17px;stroke:var(--ink-3);stroke-width:2;fill:none;flex:none}
.role-toggle{display:none;align-items:center;gap:5px;padding:0 10px;height:44px;min-height:44px;
  border-radius:999px;background:var(--subtle);color:var(--ink-2);font-size:11px;font-weight:600;
  cursor:pointer;flex:none;white-space:nowrap}
.role-toggle svg{width:15px;height:15px;flex:none}
.msg{width:44px;height:44px;min-height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;position:relative;flex:none;cursor:pointer}
.msg svg{width:21px;height:21px;stroke:var(--ink-2);stroke-width:2;fill:none}
.dot{position:absolute;top:4px;right:6px;min-width:16px;height:16px;padding:0 4px;background:var(--price);
  color:#fff;border-radius:999px;font-size:10px;font-weight:600;display:flex;align-items:center;
  justify-content:center;border:2px solid #fff}
.topbar.not-logged .search{flex:0 0 156px}
.topbar.not-logged .role-toggle{display:flex}
.topbar.not-logged .msg{display:none}

.scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.scroll::-webkit-scrollbar{display:none}

/* Banner：华商GO 渐变 + 左侧深色遮罩（白字可读） */
.banner{margin:12px 16px;height:108px;border-radius:var(--r-lg);position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--g-banner-1),var(--g-banner-2))}
.banner::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 58%,transparent 100%)}
.banner .inner{position:relative;z-index:1;height:100%;padding:18px 20px;
  display:flex;flex-direction:column;justify-content:center;color:#fff}
.banner .b-sub{font-size:14px;font-weight:500;opacity:.92}
.banner .b-main{margin-top:6px;font-size:21px;font-weight:800;line-height:1.28}
.banner .deco{position:absolute;right:-24px;top:-24px;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.13);z-index:0}

/* 金刚区：白卡，无边框 */
.grid-card{margin:0 16px 12px;background:var(--card);border-radius:var(--r-lg);padding:18px 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0}
.grid-item{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  min-height:44px;padding:2px 0}
.grid-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.grid-ic svg{width:26px;height:26px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gi-orange{background:#FFF7E6}.gi-orange svg{stroke:#9C6607}
.gi-blue{background:#E6F4FF}.gi-blue svg{stroke:#1369E2}
.gi-green{background:#F6FFED}.gi-green svg{stroke:#2F860B}
.gi-red{background:#FFF1F0}.gi-red svg{stroke:#C93C3E}
.grid-item span{font-size:11px;color:var(--ink-2);font-weight:500}

/* 区块标题：华商GO 式，大标题 + 查看更多（无色条） */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;
  padding:6px 16px 10px;margin-top:6px}
.sec-title{font-size:18px;font-weight:700;letter-spacing:-.2px}
.sec-more{font-size:12px;color:var(--ink-3);min-height:44px;display:flex;align-items:center;cursor:pointer}

/* 热门求购 横滑：白卡无边框 */
.hot{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory}
.hot::-webkit-scrollbar{display:none}
.hot-card{flex:0 0 236px;scroll-snap-align:start;background:var(--card);border-radius:var(--r-lg);
  padding:16px;display:flex;gap:10px;cursor:pointer;transition:transform .1s}
.hot-card:active{transform:scale(.98)}
.hot-card .thumb{width:88px;border-radius:8px;background:#F0F0F0;flex:none;overflow:hidden;
  border:1px solid #F0F0F0}
.hot-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hot-card .body{flex:1;min-width:0;display:flex;flex-direction:column}
.hot-card h4{font-size:15px;font-weight:600;line-height:1.3;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.time{flex:none;font-size:11px;color:var(--ink-3);white-space:nowrap}
.cat{display:inline-block;font-size:11px;font-weight:500;color:var(--primary-ink);
  background:var(--primary-bg);border-radius:4px;padding:1px 5px;margin-bottom:5px;width:fit-content}
.desc{font-size:11px;color:var(--ink-2);line-height:1.35;margin:0 0 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.qty{font-size:12px;color:var(--price);font-weight:600}
.region{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);white-space:nowrap}

/* 全部求购 列表：白卡无边框，内距 16px */
.list{padding:0 16px 8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;
  display:flex;gap:12px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card .thumb{width:92px;height:92px;border-radius:8px;background:#F0F0F0;flex:none;overflow:hidden;
  border:1px solid #F0F0F0}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column}
.card h4{font-size:16px;font-weight:700;line-height:1.3;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cat{font-size:12px;margin-bottom:5px}
.card .desc{font-size:12px;margin:0 0 6px}
.card .meta{margin-top:auto}
.card .qty{font-size:14px;font-weight:600}
.card .region{font-size:12px}
.card .time{font-size:12px}

.fab{position:absolute;right:16px;bottom:132px;z-index:30}
.fab-btn{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 6px 16px rgba(245,166,35,.42);cursor:pointer;transition:transform .1s}
.fab-btn:active{transform:scale(.95)}
.fab-btn svg{width:17px;height:17px;stroke:var(--accent-ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.fab-text{font-size:9px;font-weight:700;line-height:1;letter-spacing:.5px}

.tabbar{height:56px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;cursor:pointer;min-height:44px}
.tab.active{color:var(--primary-ink)}
.tab .ic{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.tab .icw{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.tab.active .icw{background:var(--primary-bg);border-radius:50%}
</style>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hotCard(d){
  return '<div class="hot-card" role="button" aria-label="'+esc(d.t)+'，采购数量 '+esc(d.q)+'，'+esc(d.r)+'" onclick="goDetail()">'
   +'<div class="thumb"><img src="img/'+d.i+'.jpg" alt="'+esc(d.t)+'"/></div>'
   +'<div class="body"><div class="card-head"><h4>'+esc(d.t)+'</h4><div class="time num">'+esc(d.time)+'</div></div>'
   +'<span class="cat">'+esc(d.c)+'</span>'
   +'<div class="desc">'+esc(d.d)+'</div>'
   +'<div class="meta"><div class="qty num">'+esc(d.q)+'</div><div class="region">'+esc(d.r)+'</div></div>'
   +'</div></div>';
}
function listCard(d){
  return '<div class="card" role="button" aria-label="'+esc(d.t)+'，采购数量 '+esc(d.q)+'，'+esc(d.r)+'" onclick="goDetail()">'
   +'<div class="thumb"><img src="img/'+d.i+'.jpg" alt="'+esc(d.t)+'"/></div>'
   +'<div class="body"><div class="card-head"><h4>'+esc(d.t)+'</h4><div class="time num">'+esc(d.time)+'</div></div>'
   +'<span class="cat">'+esc(d.c)+'</span>'
   +'<div class="desc">'+esc(d.d)+'</div>'
   +'<div class="meta"><div class="qty num">采购数量：'+esc(d.q)+'</div><div class="region">'+esc(d.r)+'</div></div>'
   +'</div></div>';
}
document.getElementById('hot').innerHTML=DATA.slice(0,3).map(hotCard).join('');
document.getElementById('list').innerHTML=DATA.slice(3).map(listCard).join('');
