<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申泽跨境贸易 · 跨境小学堂</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background:#E9EDF2; display:flex; justify-content:center; padding:32px 0; }
  .phone { width:390px; height:844px; background:var(--bg-page); border-radius:44px; box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; position:relative; border:10px solid #111; display:flex; flex-direction:column; }
  .statusbar { height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; color:var(--ink-primary); }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .topbar { height:48px; flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:#fff; }
  .topbar .loc { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; }
  .back { display:flex; align-items:center; }
  .scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .chips { display:flex; gap:8px; padding:10px 16px; background:#fff; }
  .chip { flex:none; padding:6px 14px; border-radius:var(--r-pill); background:var(--bg-page); font-size:13px; color:var(--ink-secondary); }
  .chip.on { background:var(--color-primary-bg); color:var(--color-primary); font-weight:600; }
  .school-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 16px; }
  .sc-card { background:#fff; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--border-weak); }
  .sc-cover { height:108px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .sc-body { padding:10px 10px 12px; }
  .sc-title { font-size:13px; font-weight:600; line-height:1.4; margin:0 0 8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sc-foot { display:flex; align-items:center; justify-content:space-between; }
  .muted { color:var(--ink-tertiary); font-size:11px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><div class="right"><span>●●●</span><span>📶</span><span>🔋</span></div></div>

  <div class="topbar">
    <div class="back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="loc" style="font-size:16px">跨境小学堂</div>
  </div>

  <div class="scroll">
    <div class="chips">
      <span class="chip on">全部</span>
      <span class="chip">视频</span>
      <span class="chip">图文</span>
      <span class="chip">物流</span>
      <span class="chip">认证</span>
    </div>

    <div class="school-grid">
      <div class="sc-card">
        <div class="sc-cover" style="background:linear-gradient(135deg,#1677FF,#4096FF)"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:30px;height:30px"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-9-4-9 4Z"/><path d="M3 7l9 4 9-4M9 12v5M15 12v5"/></svg></div>
        <div class="sc-body">
          <p class="sc-title">新手卖家如何快速完成企业认证</p>
          <div class="sc-foot"><span class="tag tag-blue">认证</span><span class="muted">1.2k 阅读</span></div>
        </div>
      </div>
      <div class="sc-card">
        <div class="sc-cover" style="background:linear-gradient(135deg,#F5A623,#FFB340)"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:30px;height:30px"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div>
        <div class="sc-body">
          <p class="sc-title">空运与海运，怎么选更省钱</p>
          <div class="sc-foot"><span class="tag tag-blue">物流</span><span class="muted">860 阅读</span></div>
        </div>
      </div>
      <div class="sc-card">
        <div class="sc-cover" style="background:linear-gradient(135deg,#52C41A,#73D13D)"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:30px;height:30px"><path d="M4 19.5V6a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2-1.5Z"/></svg></div>
        <div class="sc-body">
          <p class="sc-title">CE 认证全流程避坑指南</p>
          <div class="sc-foot"><span class="tag tag-blue">认证</span><span class="muted">2.4k 阅读</span></div>
        </div>
      </div>
      <div class="sc-card">
        <div class="sc-cover" style="background:linear-gradient(135deg,#722ED1,#9254DE)"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:30px;height:30px"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></div>
        <div class="sc-body">
          <p class="sc-title">视频：写好供应标题的 5 个技巧</p>
          <div class="sc-foot"><span class="tag tag-blue">视频</span><span class="muted">3.1k 播放</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
