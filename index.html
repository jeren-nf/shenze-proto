<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>跨境贸易服务平台</title>
<style>
  :root { --brand:#1677FF; --bg:#f5f7fa; --card:#fff; --text:#1f2329; --sub:#646a73; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 16px; }
  .wrap { max-width:880px; width:100%; }
  header { text-align:center; margin-bottom:36px; }
  header h1 { font-size:26px; font-weight:700; }
  header p { color:var(--sub); margin-top:8px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); transition:.2s; text-decoration:none; color:inherit; display:block; border:1px solid #eef0f3; }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(22,119,255,.15); border-color:var(--brand); }
  .badge { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; background:rgba(22,119,255,.1); color:var(--brand); margin-bottom:14px; }
  .card h2 { font-size:18px; margin-bottom:8px; }
  .card p { color:var(--sub); font-size:13px; line-height:1.6; }
  .pages { margin-top:12px; font-size:12px; color:var(--sub); }
  footer { text-align:center; color:var(--sub); font-size:12px; margin-top:36px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>跨境贸易服务平台</h1>
    </header>
    <div class="grid">
      <a class="card" href="bj10/index.html">
        <span class="badge">嵌套 · FR 编号版</span>
        <h2>原型总览</h2>
        <p>卖家端 / 买家端 / 管理后台三套，按 FR 编号组织，32 页完整交互原型。</p>
        <div class="pages">seller 14 · buyer 6 · admin 12</div>
      </a>
      <a class="card" href="bj6/index.html">
        <span class="badge">原始扁平总览</span>
        <h2>UI 总览</h2>
        <p>全部 32 页可预览 HTML 原型，作为对照参考。</p>
        <div class="pages">扁平 · 全部 32 页</div>
      </a>
      <a class="card" href="sh3/index.html">
        <span class="badge">UI 细化版</span>
        <h2>UI 细化总览</h2>
        <p>基于原型的视觉/交互细化版本，部分页面已细化、部分待细化。</p>
        <div class="pages">扁平原型 · 含细化页与资源图</div>
      </a>
    </div>
    <footer>来源 PRD  · 仅供内部评审</footer>
  </div>
</body>
</html>
